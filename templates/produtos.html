
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Produtos - Mercado Boa Compra</title>
</head>

<body>

    <h1>Mercado Boa Compra</h1>
    <h2>Cadastro de Produtos</h2>

    <a href="/">Voltar para o início</a>

    <hr>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% if mensagens %}
            {% for categoria, mensagem in mensagens %}
                <p role="status">
                    {{ mensagem }}
                </p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('cadastrar_produto') }}">

        <p>
            <label for="nome">Nome do produto:</label>
            <input type="text"
                   id="nome"
                   name="nome"
                   required
                   maxlength="150">
        </p>

        <p>
            <label for="categoria">Categoria:</label>
            <input type="text"
                   id="categoria"
                   name="categoria"
                   required
                   maxlength="100">
        </p>

        <p>
            <label for="preco">Preço (R$):</label>
            <input type="number"
                   id="preco"
                   name="preco"
                   min="0"
                   step="0.01"
                   required>
        </p>

        <p>
            <label for="quantidade">Quantidade inicial:</label>
            <input type="number"
                   id="quantidade"
                   name="quantidade"
                   min="0"
                   step="1"
                   required>
        </p>

        <p>
            <label for="estoque_minimo">Estoque mínimo:</label>
            <input type="number"
                   id="estoque_minimo"
                   name="estoque_minimo"
                   min="0"
                   step="1"
                   required>
        </p>

        <button type="submit">
            Cadastrar produto
        </button>

    </form>

</body>
</html>
